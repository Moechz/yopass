# ===========================================================================
# Yopass for TerraMaster TOS 7 (multi-container Docker application)
# ===========================================================================
# App image  : jhaals/yopass:16.2.0 (Docker Hub)
# Cache      : memcached:1.6-alpine (internal only)
#
# Yopass stores encrypted secrets in memcached with an expiry; the app wraps
# the secret in a link whose key lives in the URL fragment. Only the app
# publishes a host port (8180). Every container runs as uid 1000.

services:
  yopassdocker:
    image: jhaals/yopass:16.2.0
    container_name: yopassdocker
    restart: unless-stopped
    user: "1000:1000"
    command:
      - "--memcached"
      - "yopassdocker-memcached:11211"
      - "--file-store"
      - "disk"
      - "--file-store-path"
      - "/data/files"
    depends_on:
      - yopassdocker-memcached
    ports:
      - "8180:1337"
    environment:
      TZ: "Asia/Shanghai"
      MEMCACHED: "yopassdocker-memcached:11211"
    volumes:
      - /Volume1/DockerAppData/yopassdocker/data:/data
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  yopassdocker-memcached:
    image: memcached:1.6-alpine
    container_name: yopassdocker-memcached
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "Asia/Shanghai"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11211"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

# TOS App Center web metadata (must be the last block of the file):
x-app-meta:
  web:
    port: 8180
    protocol: http
